name: Irene Daily Strategy & Industry Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
      timezone: "Australia/Melbourne"

permissions:
  contents: write

jobs:
  send-daily-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily brief script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          OPENAI_MODEL: gpt-6-luna
          STRICT_AI: "1"
        run: python daily_brief.py

      - name: Commit project pipeline if changed
        run: |
          if [ -f data/chengdu_project_pipeline.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/chengdu_project_pipeline.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update Chengdu project pipeline"
              git push
            fi
          fi
